[package]
name = "test-compile"
version = "0.1.4"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tinkerforge-base = { path = "../tinkerforge-base", version = "0.1.4" }
tokio = { version = "1.38.2", features = ["net", "io-util", "rt-multi-thread", "macros", "sync"] }
tokio-stream = { version = "0.1.15", features = ["sync"] }
futures-core = "0.3.32"
anyhow = "1.0.101"

[build-dependencies]
tinkerforge-generator = { path = "../tinkerforge-generator" , version = "0.1.4" }
prettyplease = "0.2.19"
